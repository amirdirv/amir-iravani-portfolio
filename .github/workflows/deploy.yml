name: Deploy

# One build pipeline, two targets:
#  1. `deploy` branch → pulled by the cPanel host that serves https://amir-iravani.it
#  2. GitHub Pages    → https://amirdirv.github.io/amir-iravani-portfolio/ (mirror)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false

      # Host build: served from the domain root.
      - name: Build for amir-iravani.it
        run: npx ng build --base-href / --output-path dist/host

      - name: Publish to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: dist/host/browser
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # Pages build: project pages live under /<repo>/.
      - name: Build for GitHub Pages
        run: npx ng build --base-href "/${GITHUB_REPOSITORY#*/}/" --output-path dist/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages/browser

  pages:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
