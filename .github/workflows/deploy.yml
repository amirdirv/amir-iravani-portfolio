name: Deploy

# push to main → test → prerender → SEO audit → publish
#  1. `deploy` branch → pulled every 5 min by the cPanel host serving https://amir-iravani.it
#  2. GitHub Pages    → a redirect stub, so old amirdirv.github.io links land on the domain
#                       (and search engines see a single canonical site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Test, build & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Build (prerender every page + sitemap, llms.txt, 404)
        run: npm run build
      - name: SEO audit (fails the deploy on any error)
        run: npm run seo:check

      - name: Publish to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: dist/amir-iravani-portfolio/browser
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Build the GitHub Pages redirect stub
        run: |
          mkdir -p pages
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Amir Iravani — moved to amir-iravani.it</title>
              <meta name="robots" content="noindex" />
              <link rel="canonical" href="https://amir-iravani.it/" />
              <meta http-equiv="refresh" content="0; url=https://amir-iravani.it/" />
              <script>
                // Keep the path: /amir-iravani-portfolio/it/projects/diar → amir-iravani.it/it/projects/diar
                var rest = location.pathname.replace(/^\/[^/]+/, '') || '/';
                location.replace('https://amir-iravani.it' + rest + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>This site now lives at <a href="https://amir-iravani.it/">amir-iravani.it</a>.</p>
            </body>
          </html>
          HTML
          cp pages/index.html pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  pages:
    name: GitHub Pages redirect
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
