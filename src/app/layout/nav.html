<div
  class="progress"
  [style.transform]="'scaleX(' + scroll.progress() + ')'"
  aria-hidden="true"
></div>

<nav class="bar container" [attr.aria-label]="i18n.ui().common.menu">
  <a class="brand" [href]="nav.home()" (click)="menuOpen.set(false)">
    <app-logo [size]="34" [animated]="true" />
    <span class="brand__name" translate="no">Amir&nbsp;Iravani</span>
  </a>

  <ul class="links" id="nav-links">
    @for (link of links(); track link.id) {
      <li>
        <a
          [href]="nav.section(link.id)"
          [class.is-active]="isHome && scroll.active() === link.id"
          [attr.aria-current]="isHome && scroll.active() === link.id ? 'location' : null"
          (click)="menuOpen.set(false)"
          >{{ link.label }}</a
        >
      </li>
    }
  </ul>

  <div class="tools">
    <button
      class="kbd-btn"
      type="button"
      (click)="commands.openPalette()"
      [attr.aria-label]="i18n.ui().common.commandHint"
    >
      <app-icon name="command" [size]="16" />
      <span class="kbd-btn__label mono">{{ modKey }} K</span>
    </button>

    <div class="langs" role="group" [attr.aria-label]="i18n.ui().common.language">
      @for (l of langs; track l.code) {
        <a
          [href]="nav.langLink(l.code)"
          (click)="nav.onLangClick($event, l.code)"
          [class.is-active]="i18n.lang() === l.code"
          [attr.aria-current]="i18n.lang() === l.code ? 'true' : null"
          [attr.hreflang]="l.code"
          [attr.lang]="l.code"
          [title]="l.native"
          >{{ l.label }}</a
        >
      }
    </div>

    <button
      class="icon-btn"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="i18n.ui().common.theme"
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
    </button>

    <button
      class="icon-btn menu-btn"
      type="button"
      aria-controls="nav-links"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? i18n.ui().common.close : i18n.ui().common.menu"
      (click)="menuOpen.set(!menuOpen())"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</nav>
