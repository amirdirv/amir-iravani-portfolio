<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Amir Iravani — Front-End Engineer (Angular) in Turin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Front-end engineer with 10+ years of experience in Angular, React and Vue, based in Turin. Digital Horizons IT programme at ENAIP Piemonte, available full-time in Italy."
    />
    <meta name="author" content="Amir Mohammad Iravani" />
    <meta name="theme-color" content="#07070c" />
    <meta name="color-scheme" content="dark light" />

    <!-- Per-page title, description, robots, canonical, hreflang, Open Graph and JSON-LD
         are written by SeoService during prerendering (src/app/core/seo.service.ts). -->
    <meta property="og:site_name" content="Amir Iravani" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking render or bootstrap; system fonts show until they arrive. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600;700&family=Vazirmatn:wght@400;500;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem('ai.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
